[package]
name = "didit"
version = "0.1.0"
description = "DidIt — stay disciplined with friends"
authors = ["DidIt"]
edition = "2021"

# `cdylib` is required for the Android/iOS shared library; `staticlib` for iOS;
# `rlib` so the desktop binary (main.rs) can link the same code.
[lib]
name = "didit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pin `time` away from 0.3.48 (published 2026-06-12), which breaks tauri-utils
# with E0119 conflicting trait impls. See tauri-apps/tauri#15525. 0.3.47 is the
# last good release; remove this pin once tauri-utils ships a fix.
time = "=0.3.47"

# The Android APK uses `--debug` (so it's auto-signed and installs without a
# keystore). Debug symbols make that build ~130MB, so drop them + strip + size-
# optimise the native lib to shrink the APK while keeping it installable.
[profile.dev]
debug = false
strip = true
opt-level = "s"
